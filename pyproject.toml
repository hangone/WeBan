[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "weban"
version = "3.11.4"
description = "auto finish weiban"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7.3",
    "nodriver>=0.50.99",
    "numpy>=2.5.5",
    "opencv-python-headless==4.10.0.84",
    "pyaes>=1.6.1",
    "PySocks>=1.7.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "pyright>=1.1.409",
    "ruff>=0.15.15",
]

[project.scripts]
weban = "weban.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["weban"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
