# WeBan 配置文件
#
# 安全提醒：password、token 和 [ai].api_key 都会以明文保存在本文件中。
# 请限制文件读取权限，不要提交到版本库、上传网盘或随日志一起分享。
#
# 账号设置（配置优先级 / 无交互判定 / Docker 运行说明见下方 [settings] 段末）
[[account]]
# 学校名称（必填，需要和登录页面显示的学校完全一致，推荐复制过来）
tenant_name = ""
# 用户名
username = ""
# 密码（默认和用户名一样）
password = ""

# 支持在账号级别覆盖全局设置，例如：
# 登录方式 2：Token (可选，优先使用，需要登录后在开发控制台获取)
# tenant_name = ""
# user_id = ""
# token = ""
# 支持在账号级别覆盖全局设置，例如：
# study_mode = "force"

# 全局设置
[settings]
# 学习模式：
# false = 不学习，跳过所有学习任务
# true  = 正常学习，默认跳过已完成内容
# force = 本轮强制重学，已完成内容也会重新学习一次；不会在同一轮无限循环
study_mode = "true"

# 考试模式：
# false = 不考试，跳过所有考试任务
# true  = 正常考试，已及格/已完成的考试默认跳过
# perfect = 本轮以满分为目标；每个考试计划最多新开一张试卷，不会连续重考
# force = 本轮即使已及格也强制再考；每个考试计划仍最多新开一张试卷
# perfect/force 如需再次尝试，须确认剩余次数后重新运行，避免自动耗尽机会
exam_mode = "perfect"

# 遇到题库中没有的题目时是否随机作答：
# true  = 单选随机，多选全选
# false = 在终端中等待手动输入答案
# 无交互模式（包括官方 Docker 镜像）没有人工输入通道；不要依赖 false
# 获取人工确认，是否允许提交仍由匹配率和交卷安全门决定
random_answer = true

# 每个学习任务的最少停留时长（秒）
# 过快不会记录学习进度，数值越大越稳妥，但整体耗时也会越长
study_time = 30

# 视频课程倍速仅用于计算完课前等待时间，不会控制网页播放器：
# 等待目标为 max(study_time, 视频时长 / video_speed)
# 1 = 按视频实际时长等待（默认，最稳妥）
# 2 = 按视频时长的一半等待（等价于 2 倍速；实测样本不足，不建议新号使用）
# 0 = 忽略视频时长，只遵守上面的 study_time
video_speed = 1

# 对未加载 apicenext.js 的课程是否补发 jupiter 翻页轨迹（默认关闭，完全对齐官方页面行为）
# 官方前端只有加载 apicenext.js 的课程会调 jupiter 上报轨迹；个别学校
# 可能要求所有微课都上报，实测不开会 10018 时可设为 true
# jupiter_fallback = false

# 登录成功后自动模拟打开官方首页（默认开启，无需配置）：对齐网页端请求面，
# 依次发送 协议/轮播图/项目统计/公告红点/公告列表/功能开关/用户信息/租户配置/
# 帮助文件/学习任务 等初始化请求，并输出未确认的必读公告后逐条确认
# （notice/listMust.do + notice/viewMust.do，与浏览器弹窗阅读行为一致）。
# 任一请求失败只记日志，不影响后续学习流程。

# 每道考试题的答题等待时长（秒）
# 格式："基础等待时间,随机等待上限"
exam_question_time = "3,3"

# 允许提交试卷的最低题库匹配率（百分比）
# 当匹配率低于此值且 random_answer = false 时，程序会放弃交卷
exam_submit_match_rate = 90

# 多账号并发时允许的最大线程数
# 实际并发数 = min(账号数, max_workers)
max_workers = 5

# 浏览器可执行文件路径
# 留空则自动检测系统中已安装的 Chrome / Chromium / Edge
# macOS 示例: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
# Windows 示例: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
# Linux 示例: "/usr/bin/google-chrome-stable"
browser_path = ""

# CDP 远程调试（连接已有浏览器实例，适用于 Docker 等无法直接启动浏览器的场景）
# 在宿主机启动 Chrome 时加上: chrome --remote-debugging-port=9222
# 然后填写以下两项，nodriver 将通过 CDP 连接该浏览器，不再启动本地浏览器
# 注意: cdp_host 和 cdp_port 需同时设置才生效；完整 CDP 配置优先于 browser_path
# Docker 环境会自动检测，无需手动配置
# CDP 等同于浏览器完全控制权：只连接专用浏览器配置，不要暴露到公网，
# 并用防火墙限制可访问来源。内置浏览器镜像的 CDP 仅监听容器回环地址。
cdp_host = ""
cdp_port = 0

# 是否启用调试日志
# 开启后会输出更多日志，比如请求体和响应体，验证码图片等
# 即使程序会脱敏常见字段，调试内容仍可能含账号、课程或响应中的个人信息；
# 分享日志前必须复查并二次打码，用完后及时删除。
debug = false

# ── 配置优先级（高→低）──
#   1. 命令行参数（--config / --data-dir / --non-interactive / --study-mode /
#      --exam-mode / --random-answer / --study-time / --video-speed /
#      --exam-question-time / --exam-submit-match-rate / --browser-path /
#      --cdp-host / --cdp-port / --jupiter-fallback / --max-workers / --debug /
#      --tenant-name / --username / --password / --user-id / --token /
#      --ai-enable / --ai-base-url / --ai-api-key / --ai-model / --ai-timeout /
#      --ai-max-retries）
#   2. 环境变量（同名加 WB_ 前缀：WB_STUDY_MODE / WB_EXAM_MODE /
#      WB_RANDOM_ANSWER / WB_STUDY_TIME / WB_VIDEO_SPEED /
#      WB_EXAM_QUESTION_TIME / WB_EXAM_SUBMIT_MATCH_RATE / WB_BROWSER_PATH /
#      WB_CDP_HOST / WB_CDP_PORT / WB_JUPITER_FALLBACK / WB_MAX_WORKERS /
#      WB_DEBUG / WB_TENANT_NAME / WB_USERNAME / WB_PASSWORD / WB_USER_ID /
#      WB_TOKEN / WB_AI_ENABLE / WB_AI_BASE_URL / WB_AI_API_KEY / WB_AI_MODEL /
#      WB_AI_TIMEOUT / WB_AI_MAX_RETRIES / WB_CONFIG / WB_DATA_DIR）
#   3. 本配置文件（[settings] 与 [[account]]）
#
# 三类名称一一对应：配置文件键名（snake_case）= 命令行参数（--kebab-case）=
# 环境变量（WB_SNAKE_CASE）。例如 study_time ↔ --study-time ↔ WB_STUDY_TIME。
#
# 无交互判定（自动，无需手动配置）：
#   - ENVIRONMENT=docker（或 container）：容器环境，镜像默认已设置
#   - stdin 不是 TTY：cron / 后台运行 / 管道 / SSH 无 TTY 会话
#   - 或显式传 --non-interactive 参数
#   无交互时：不弹编辑器、所有确认用默认值、验证码/考试不等待手动输入、
#   不打开可见浏览器、末尾不等待回车。该限制不能由其他配置项反向覆盖。
#
# 首次运行（交互式）不需要手动创建本文件：程序会提示输入学校/学号/密码，
# 验证登录成功后自动把账号写入本文件；登录失败不会生成/修改文件。
#
# Docker 运行（无交互、数据持久化）：
#   docker run -v ./data:/app/data hangyi/weban
#   - 镜像默认已设 WB_DATA_DIR=/app/data 与 ENVIRONMENT=docker，
#     数据目录挂载 ./data:/app/data 后 config.toml/logs/answer 都会持久化
#   - 首次运行会在数据目录生成 config.example.toml 模板，填写账号后重跑
#   - 即使加 -it，ENVIRONMENT=docker 仍保持无交互；需人工输入或可见浏览器时，
#     请在宿主机直接运行源码/原生可执行文件
#   - captcha_model.onnx 是可选的登录验证码 OCR 资源。缺失时程序仍可启动：
#     交互运行回退人工输入；无交互/Docker 的密码登录会明确失败，Token 登录不受影响
#
# AI 答题设置
[ai]
# 是否启用 AI 搜题。启用后，题干和选项会发送到 base_url 指向的第三方服务；
# 请先确认课程数据允许外传并接受服务商的隐私条款。默认关闭，失败时按本地策略降级。
enable = false
# API 基础路径，例如 DeepSeek、硅基流动等 OpenAI 兼容接口路径（/chat/completions）
base_url = "https://opencode.ai/zen/v1"
# AI 服务的 API Key（明文敏感信息，优先通过 WB_AI_API_KEY 临时注入）
api_key = ""
# 调用的模型名称，如 deepseek-v4-flash 等
model = "nemotron-3-ultra-free"
# 请求超时时间（秒）
timeout = 60
# 请求失败时的最大重试次数
max_retries = 2
